<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ISOTIPO: Hexágono industrial con excavadora estilizada -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Base Hexagonal -->
    <path d="M20 2 L36 11 L36 29 L20 38 L4 29 L4 11 Z" fill="url(#iconBg)" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Brazo y Cucharón Industrial -->
    <path d="M12 25 L18 15 L26 15 L29 20 L24 25 Z" fill="url(#goldGrad)" />
    <path d="M22 13 L27 13 L29 17 L24 17 Z" fill="#f8fafc" opacity="0.9" />
    <circle cx="18" cy="15" r="2" fill="#0f172a" />
    <circle cx="26" cy="15" r="2" fill="#0f172a" />
    
    <!-- Oruga / Base -->
    <rect x="10" y="27" width="20" height="4" rx="2" fill="#94a3b8" />
    <circle cx="13" cy="29" r="1" fill="#0f172a" />
    <circle cx="20" cy="29" r="1" fill="#0f172a" />
    <circle cx="27" cy="29" r="1" fill="#0f172a" />
  </g>

  <!-- TEXTO: RENTA TOOLS -->
  <text x="56" y="32" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">
    <tspan fill="url(#goldGrad)">RENTA</tspan>
    <tspan fill="#f8fafc">TOOLS</tspan>
  </text>

  <!-- BADGE: PRO -->
  <g transform="translate(208, 16)">
    <rect width="40" height="19" rx="9.5" fill="url(#goldGrad)" />
    <text x="20" y="13.5" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#0b0f19" text-anchor="middle" letter-spacing="0.5">PRO</text>
  </g>
</svg>
