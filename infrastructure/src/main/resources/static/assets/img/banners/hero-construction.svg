<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350" fill="none">
  <defs>
    <linearGradient id="heroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="heroCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="heroDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Plataforma Isométrica Tecnológica -->
  <g transform="translate(250, 190)" filter="url(#heroGlow)">
    <!-- Base Isométrica Hexagonal -->
    <polygon points="0,-90 190,-10 190,40 0,120 -190,40 -190,-10" fill="url(#heroDark)" stroke="url(#heroGold)" stroke-width="2" />
    <polygon points="0,-90 190,-10 0,70 -190,-10" fill="#141d2f" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
    
    <!-- Retícula Tecnológica Neón -->
    <line x1="-120" y1="-35" x2="60" y2="45" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" stroke-dasharray="6 4" />
    <line x1="-60" y1="-65" x2="120" y2="15" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" stroke-dasharray="6 4" />
    <line x1="-120" y1="15" x2="60" y2="-65" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" />
    <line x1="-60" y1="45" x2="120" y2="-35" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" />

    <!-- Torre Grúa en Construcción (Isométrica) -->
    <g transform="translate(-80, -90)">
      <line x1="0" y1="60" x2="0" y2="-110" stroke="url(#heroGold)" stroke-width="4" />
      <line x1="12" y1="60" x2="12" y2="-110" stroke="url(#heroGold)" stroke-width="4" />
      <!-- Celosías de Grúa -->
      <line x1="0" y1="40" x2="12" y2="20" stroke="#fbbf24" stroke-width="2" />
      <line x1="12" y1="20" x2="0" y2="0" stroke="#fbbf24" stroke-width="2" />
      <line x1="0" y1="0" x2="12" y2="-20" stroke="#fbbf24" stroke-width="2" />
      <line x1="12" y1="-20" x2="0" y2="-40" stroke="#fbbf24" stroke-width="2" />
      <line x1="0" y1="-40" x2="12" y2="-60" stroke="#fbbf24" stroke-width="2" />
      <line x1="12" y1="-60" x2="0" y2="-80" stroke="#fbbf24" stroke-width="2" />
      <!-- Pluma Horizontal de la Grúa -->
      <line x1="-35" y1="-100" x2="110" y2="-100" stroke="url(#heroGold)" stroke-width="4" />
      <!-- Tirantes de Cable -->
      <line x1="6" y1="-125" x2="105" y2="-100" stroke="#f8fafc" stroke-width="1.5" />
      <line x1="6" y1="-125" x2="-30" y2="-100" stroke="#f8fafc" stroke-width="1.5" />
      <rect x="-35" y="-95" width="18" height="12" rx="2" fill="#ef4444" />
      <!-- Carro y Gancho de Carga -->
      <rect x="55" y="-98" width="10" height="6" fill="#38bdf8" />
      <line x1="60" y1="-92" x2="60" y2="-60" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="3 2" />
      <circle cx="60" cy="-56" r="3" fill="#facc15" />
    </g>

    <!-- Retroexcavadora Central Estilizada -->
    <g transform="translate(30, -30)">
      <!-- Orugas -->
      <polygon points="-40,15 40,-15 40,5 -40,35" fill="#0f172a" stroke="#475569" stroke-width="2" />
      <circle cx="-25" cy="25" r="4" fill="#fbbf24" />
      <circle cx="0" cy="15" r="4" fill="#fbbf24" />
      <circle cx="25" cy="5" r="4" fill="#fbbf24" />
      <!-- Cuerpo y Cabina -->
      <polygon points="-30,5 20,-15 10,-45 -40,-25" fill="url(#heroGold)" />
      <polygon points="-10,-15 15,-25 8,-40 -17,-30" fill="rgba(56, 189, 248, 0.5)" stroke="#38bdf8" stroke-width="1" />
      <!-- Brazo Articulado -->
      <path d="M10 -25 L55 -60 L85 -30 L105 -45" fill="none" stroke="url(#heroGold)" stroke-width="5" stroke-linecap="round" />
      <circle cx="55" cy="-60" r="4" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
      <!-- Cucharón -->
      <polygon points="105,-45 120,-35 110,-20 95,-30" fill="#1e293b" stroke="#facc15" stroke-width="2" />
    </g>

    <!-- Puntos de Conexión IoT en Obra (Puntos de Telemetría) -->
    <g transform="translate(-110, 10)">
      <circle cx="0" cy="0" r="5" fill="#06b6d4" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.6" />
    </g>
    <g transform="translate(130, -35)">
      <circle cx="0" cy="0" r="5" fill="#f59e0b" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.6" />
    </g>
  </g>
</svg>
