<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgWe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="weberOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="hondaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <pattern id="gridWe" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <filter id="vibeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgWe)" />
  <rect width="800" height="500" fill="url(#gridWe)" />
  <circle cx="400" cy="240" r="160" fill="rgba(249, 115, 22, 0.05)" />
  <line x1="60" y1="430" x2="740" y2="430" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- COMPACTADORA TIPO CANGURO WEBER MT 68KG -->
  <g transform="translate(300, 60)">
    <!-- Manillar de Guía Ergonómico con Silentblocks Antivibración -->
    <path d="M40 40 C40 20, 160 20, 160 40 L160 120 L140 120 L140 50 C140 45, 60 45, 60 50 L60 120 L40 120 Z" fill="#0f172a" stroke="#f97316" stroke-width="2.5" />
    <!-- Rodillo Superior para Facilitar Carga en Camioneta -->
    <rect x="80" y="24" width="40" height="12" rx="4" fill="#64748b" />
    <!-- Acelerador y Palanca de Desconexión Rápida -->
    <circle cx="150" cy="50" r="6" fill="#ef4444" />
    <line x1="150" y1="50" x2="165" y2="45" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

    <!-- Tanque de Combustible de Polietileno con Filtro Doble -->
    <rect x="60" y="80" width="80" height="40" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2" />
    <!-- Tapa del Tanque con Respiradero -->
    <rect x="85" y="70" width="30" height="10" rx="3" fill="#cbd5e1" />

    <!-- Motor Honda GX100 4 Tiempos Especial para Apisonadores -->
    <rect x="50" y="125" width="100" height="90" rx="10" fill="url(#hondaRed)" stroke="#0f172a" stroke-width="3" />
    <!-- Filtro de Aire de 3 Etapas Ciclónico -->
    <rect x="135" y="135" width="30" height="45" rx="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Arranque Manual Retráctil -->
    <circle cx="100" cy="170" r="22" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="100" cy="170" r="8" fill="#ef4444" />
    <!-- Placa de Marca Weber / Honda -->
    <text x="100" y="205" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="900" fill="#f8fafc" text-anchor="middle">HONDA GX100</text>

    <!-- Caja del Sistema Biela-Manivela en Baño de Aceite -->
    <path d="M70 215 L130 215 L125 270 L75 270 Z" fill="url(#weberOrange)" stroke="#0f172a" stroke-width="2" />
    <!-- Visor de Nivel de Aceite -->
    <circle cx="100" cy="245" r="8" fill="#0f172a" stroke="#facc15" stroke-width="2" />
    <circle cx="100" cy="245" r="4" fill="#fbbf24" />

    <!-- Fuelle / Bota de Protección de Poliuretano Alemán (Acordeón) -->
    <g fill="#facc15" stroke="#78350f" stroke-width="2">
      <!-- Pliegue 1 -->
      <path d="M70 270 C60 280, 140 280, 130 270 Z" />
      <!-- Pliegue 2 -->
      <path d="M68 285 C58 295, 142 295, 132 285 Z" />
      <!-- Pliegue 3 -->
      <path d="M66 300 C56 310, 144 310, 134 300 Z" />
      <!-- Pliegue 4 -->
      <path d="M64 315 C54 325, 146 325, 136 315 Z" />
      <!-- Pliegue 5 -->
      <path d="M62 330 C52 340, 148 340, 138 330 Z" />
      <!-- Pliegue 6 -->
      <path d="M60 345 C50 355, 150 355, 140 345 Z" />
    </g>

    <!-- Cilindro Guía y Pistón de Impacto -->
    <rect x="85" y="360" width="30" height="25" fill="#334155" />

    <!-- Zapata / Pie de Apisonado de Acero Forjado y Madera Laminada -->
    <path d="M60 385 L140 385 L170 410 L20 410 Z" fill="url(#weberOrange)" stroke="#0f172a" stroke-width="2" />
    <!-- Placa de Desgaste de Acero Templado en Base -->
    <rect x="15" y="410" width="160" height="12" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="2" />
    <!-- Tornillos de Fijación de Alta Resistencia -->
    <circle cx="35" cy="398" r="3" fill="#0f172a" />
    <circle cx="70" cy="398" r="3" fill="#0f172a" />
    <circle cx="105" cy="398" r="3" fill="#0f172a" />
    <circle cx="140" cy="398" r="3" fill="#0f172a" />
  </g>

  <!-- Ondas de Impacto en el Suelo -->
  <g transform="translate(400, 475)" filter="url(#vibeGlow)">
    <ellipse cx="0" cy="0" rx="110" ry="10" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6" />
    <ellipse cx="0" cy="0" rx="160" ry="14" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="10 8" opacity="0.6" />
  </g>

  <!-- Placa Técnica Superior -->
  <rect x="40" y="35" width="280" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
  <circle cx="60" cy="53" r="6" fill="#f59e0b" />
  <text x="76" y="58" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">WEBER MT 68kg · HONDA 4T</text>

  <!-- Badge Fuerza Impacto -->
  <g transform="translate(620, 35)">
    <rect width="140" height="36" rx="8" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="1.2" />
    <text x="70" y="23" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fb923c" text-anchor="middle">FUERZA 16 kN</text>
  </g>
</svg>
