<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgKarch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="karchYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <pattern id="gridKarch" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgKarch)" />
  <rect width="800" height="500" fill="url(#gridKarch)" />
  <circle cx="400" cy="240" r="160" fill="rgba(250, 204, 21, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- HIDROLAVADORA INDUSTRIAL KÄRCHER HD 10 -->
  <g transform="translate(240, 50)">
    <!-- Asa Tubular Ergonómica de Empuje -->
    <path d="M70 40 L70 140 L190 140 L190 40" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" />
    <rect x="90" y="34" width="80" height="12" rx="4" fill="#0f172a" />

    <!-- Carcasa Vertical Kärcher Amarillo/Gris Antracita -->
    <!-- Carcasa Amarilla Superior -->
    <path d="M60 140 L200 140 Q215 140 215 160 L215 260 L45 260 L45 160 Q45 140 60 140 Z" fill="url(#karchYellow)" stroke="#ca8a04" stroke-width="2" />
    <text x="130" y="195" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="900" letter-spacing="1">KÄRCHER</text>
    <text x="130" y="220" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="2">PROFESSIONAL HD</text>

    <!-- Interruptor Giratorio On/Off / Manómetro Presión -->
    <circle cx="130" cy="242" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
    <line x1="130" y1="242" x2="138" y2="236" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

    <!-- Compartimiento Motor-Bomba Inferior (Antracita) -->
    <rect x="40" y="260" width="180" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Rejillas Refrigeración -->
    <line x1="60" y1="280" x2="110" y2="280" stroke="#0f172a" stroke-width="3" />
    <line x1="60" y1="295" x2="110" y2="295" stroke="#0f172a" stroke-width="3" />
    <line x1="60" y1="310" x2="110" y2="310" stroke="#0f172a" stroke-width="3" />

    <!-- Conexión de Entrada de Agua (Manguera Jardín) -->
    <rect x="140" y="300" width="20" height="15" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />

    <!-- Salida de Alta Presión de Latón (Quick Connect) -->
    <rect x="175" y="295" width="22" height="20" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="2" />

    <!-- Manguera de Alta Presión con Refuerzo de Acero (15 metros) -->
    <path d="M195 305 Q240 330 260 280 Q280 230 250 160 L240 100" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />

    <!-- Pistola Gatillo EASY!Force y Lanza de Acero Inoxidable -->
    <!-- Empuñadura Pistola -->
    <g transform="translate(240, 80) rotate(-25)">
      <path d="M0 0 L15 0 L15 35 L0 35 Z" fill="#0f172a" stroke="#ca8a04" stroke-width="1.5" />
      <path d="M5 12 L10 12 L10 24 L5 24 Z" fill="#facc15" />
      <!-- Cañón / Tubo Lanza Metálica -->
      <line x1="15" y1="5" x2="110" y2="5" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
      <!-- Boquilla Triple Power Nozzle -->
      <polygon points="110,1 125,3 125,7 110,9" fill="#f59e0b" />
      <!-- Chorro de Agua en Abanico de Alta Presión (3000 PSI) -->
      <path d="M125 5 L175 -15 L175 25 Z" fill="rgba(56, 189, 248, 0.35)" />
      <line x1="125" y1="5" x2="175" y2="5" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
    </g>

    <!-- Ruedas Todo Terreno para Transporte de Obra -->
    <circle cx="50" cy="335" r="32" fill="#0f172a" stroke="#64748b" stroke-width="3" />
    <circle cx="50" cy="335" r="16" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <circle cx="210" cy="335" r="32" fill="#0f172a" stroke="#64748b" stroke-width="3" />
    <circle cx="210" cy="335" r="16" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
  </g>

  <!-- Placa Informativa -->
  <g transform="translate(400, 435)">
    <rect x="-190" y="0" width="380" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#facc15" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">HIDROLAVADORA 3000 PSI • KÄRCHER HD</text>
  </g>
</svg>
