<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgCort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="husqOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <pattern id="gridCort" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgCort)" />
  <rect width="800" height="500" fill="url(#gridCort)" />
  <circle cx="400" cy="240" r="160" fill="rgba(249, 115, 22, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- CORTADORA DE PAVIMENTO HUSQVARNA FS 400 -->
  <g transform="translate(190, 90)">
    <!-- Manillar de Operación -->
    <path d="M80 70 L140 180 L200 220" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M70 70 L90 70" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
    <!-- Volante de Ajuste de Profundidad -->
    <circle cx="120" cy="120" r="18" fill="none" stroke="#e2e8f0" stroke-width="4" />
    <line x1="120" y1="102" x2="120" y2="138" stroke="#e2e8f0" stroke-width="3" />
    <line x1="102" y1="120" x2="138" y2="120" stroke="#e2e8f0" stroke-width="3" />

    <!-- Tanque de Agua Integrado -->
    <path d="M170 140 L260 140 Q280 140 280 160 L280 200 L170 200 Z" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" />
    <text x="225" y="175" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">WATER TANK</text>

    <!-- Motor a Gasolina / Chasis -->
    <rect x="180" y="200" width="130" height="75" rx="6" fill="url(#husqOrange)" stroke="#ea580c" stroke-width="2" />
    <!-- Filtro y Escape -->
    <rect x="200" y="180" width="35" height="20" rx="3" fill="#334155" />
    <rect x="290" y="210" width="25" height="15" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />

    <!-- Protector de Banda y Transmisión -->
    <path d="M220 250 L330 250 L340 280 L220 280 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />

    <!-- Guarda del Disco Diamantado (14"-18") -->
    <path d="M300 280 A 65 65 0 0 1 420 280 L420 300 L300 300 Z" fill="url(#husqOrange)" stroke="#c2410c" stroke-width="3" />
    
    <!-- Disco Diamantado -->
    <g transform="translate(360, 285)">
      <circle cx="0" cy="0" r="55" fill="url(#bladeGrad)" stroke="#94a3b8" stroke-width="2" />
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
      <line x1="-50" y1="0" x2="50" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
      <line x1="0" y1="-50" x2="0" y2="50" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
      <!-- Dientes Segmentados del Disco -->
      <circle cx="0" cy="0" r="53" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="4 8" />
    </g>

    <!-- Puntero Guía de Corte Frontal -->
    <line x1="360" y1="310" x2="450" y2="330" stroke="#f59e0b" stroke-width="3" />
    <circle cx="450" cy="330" r="6" fill="#ef4444" />

    <!-- Ruedas de Transporte Heavy Duty -->
    <!-- Rueda Delantera -->
    <circle cx="310" cy="315" r="22" fill="#0f172a" stroke="#64748b" stroke-width="3" />
    <circle cx="310" cy="315" r="10" fill="#f59e0b" />
    <!-- Rueda Trasera -->
    <circle cx="160" cy="315" r="22" fill="#0f172a" stroke="#64748b" stroke-width="3" />
    <circle cx="160" cy="315" r="10" fill="#f59e0b" />
    <!-- Eje de Chasis -->
    <line x1="160" y1="315" x2="310" y2="315" stroke="#475569" stroke-width="4" />
  </g>

  <!-- Placa Informativa -->
  <g transform="translate(400, 435)">
    <rect x="-190" y="0" width="380" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">CORTADORA DE PAVIMENTO 14" • HUSQVARNA</text>
  </g>
</svg>
