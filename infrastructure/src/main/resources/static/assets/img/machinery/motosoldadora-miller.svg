<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgMill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="millerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <pattern id="gridMill" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgMill)" />
  <rect width="800" height="500" fill="url(#gridMill)" />
  <circle cx="400" cy="240" r="160" fill="rgba(2, 132, 199, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- MOTOSOLDADORA MILLER BOBCAT 250 -->
  <g transform="translate(190, 80)">
    <!-- Ojo de Elevación Central Robusto -->
    <path d="M190 70 L210 70 L215 100 L185 100 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
    <circle cx="200" cy="80" r="8" fill="#0b1120" stroke="#f59e0b" stroke-width="3" />

    <!-- Carcasa Metálica Azul Miller Bobcat -->
    <path d="M70 100 L330 100 Q345 100 345 115 L345 280 L55 280 L55 115 Q55 100 70 100 Z" fill="url(#millerBlue)" stroke="#38bdf8" stroke-width="2" />

    <!-- Logo / Letras Miller -->
    <text x="235" y="145" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900" font-style="italic" letter-spacing="2">Miller</text>
    <text x="235" y="170" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="3">BOBCAT 250</text>

    <!-- Escape Superior Curvo de Diésel -->
    <path d="M290 100 L290 60 Q290 50 305 50 L315 50" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round" />
    <rect x="284" y="65" width="12" height="25" rx="2" fill="#334155" />

    <!-- Rejillas de Ventilación Laterales -->
    <g fill="#0f172a" stroke="#0284c7" stroke-width="1">
      <rect x="200" y="190" width="120" height="8" rx="2" />
      <rect x="200" y="205" width="120" height="8" rx="2" />
      <rect x="200" y="220" width="120" height="8" rx="2" />
      <rect x="200" y="235" width="120" height="8" rx="2" />
      <rect x="200" y="250" width="120" height="8" rx="2" />
    </g>

    <!-- Panel de Control Frontal (Lado Izquierdo) -->
    <rect x="70" y="115" width="105" height="150" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    
    <!-- Selector de Rango de Amperaje A / Proceso SMAW-MIG-TIG -->
    <circle cx="122" cy="145" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <line x1="122" y1="145" x2="132" y2="135" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <text x="122" y="175" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">250 AMP</text>

    <!-- Tomas Auxiliares AC 120V / 240V Generador (11kW) -->
    <rect x="85" y="190" width="22" height="22" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="115" y="190" width="22" height="22" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="145" y="190" width="22" height="22" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Bornes de Conexión de Soldadura (+ y -) Heavy Duty 50mm -->
    <!-- Positivo Rojo -->
    <circle cx="100" cy="240" r="12" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <text x="100" y="244" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">+</text>
    <!-- Negativo Negro -->
    <circle cx="145" cy="240" r="12" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <text x="145" y="244" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">-</text>

    <!-- Cables de Soldadura Enrollados -->
    <path d="M100 252 Q80 290 60 310 Q40 330 60 340 Q80 340 100 325" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
    <path d="M145 252 Q160 290 180 310 Q200 330 180 340 Q160 340 140 325" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <!-- Pinza Portaelectrodo y Pinza de Masa -->
    <polygon points="50,335 40,350 48,355 58,340" fill="#f59e0b" />
    <polygon points="190,335 200,350 192,355 182,340" fill="#94a3b8" />

    <!-- Base / Patas Antivibratorias con Patín de Transporte -->
    <rect x="45" y="280" width="310" height="20" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Placa Informativa -->
  <g transform="translate(400, 435)">
    <rect x="-190" y="0" width="380" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#0284c7" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">MOTOSOLDADORA 250A • MILLER BOBCAT</text>
  </g>
</svg>
