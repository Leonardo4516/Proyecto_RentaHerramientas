<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgLeica" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="leicaWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="leicaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="gridLeica" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgLeica)" />
  <rect width="800" height="500" fill="url(#gridLeica)" />
  <circle cx="400" cy="240" r="160" fill="rgba(239, 68, 68, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- ESTACIÓN TOTAL LEICA GEOSYSTEMS TS07 -->
  <g transform="translate(250, 40)">
    <!-- Rayo Láser EDM Medición -->
    <line x1="210" y1="130" x2="520" y2="90" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />
    <circle cx="520" cy="90" r="4" fill="#ef4444" />

    <!-- Asa de Transporte Superior con Nivel Esférico -->
    <path d="M110 90 L110 50 Q150 40 190 50 L190 90" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <rect x="135" y="42" width="30" height="8" rx="2" fill="#e2e8f0" />

    <!-- Telescopio Óptico Central EDM / Colimador -->
    <rect x="80" y="115" width="140" height="30" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <!-- Lente Objetivo / Vidrio Tratado con Revestimiento -->
    <circle cx="215" cy="130" r="18" fill="#38bdf8" stroke="#ef4444" stroke-width="3" />
    <circle cx="215" cy="130" r="10" fill="#0284c7" />
    <!-- Ocular / Visor Trasero -->
    <rect x="70" y="122" width="15" height="16" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2" />

    <!-- Montantes Laterales Alidada -->
    <path d="M100 90 L100 200 L200 200 L200 90 Z" fill="url(#leicaWhite)" stroke="#94a3b8" stroke-width="2" />
    <!-- Círculo Rojo Leica Logo -->
    <circle cx="150" cy="105" r="10" fill="url(#leicaRed)" />
    <text x="150" y="109" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold">Leica</text>

    <!-- Pantalla Táctil a Color y Teclado Alfanumérico -->
    <rect x="110" y="130" width="80" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="115" y="135" width="70" height="30" rx="2" fill="#0284c7" fill-opacity="0.3" />
    <!-- Retícula / Coordenadas en Pantalla -->
    <line x1="150" y1="135" x2="150" y2="165" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="115" y1="150" x2="185" y2="150" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
    <text x="150" y="160" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="7">X: 1042.8 Y: 593.1</text>
    <!-- Teclas -->
    <line x1="120" y1="172" x2="180" y2="172" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 2" />

    <!-- Base Nivelante Tribrach con Tornillos Calantes -->
    <path d="M90 200 L210 200 L220 230 L80 230 Z" fill="#334155" stroke="#64748b" stroke-width="2" />
    <!-- Tornillos Calantes de Nivelación -->
    <circle cx="100" cy="225" r="8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <circle cx="200" cy="225" r="8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <line x1="80" y1="230" x2="220" y2="230" stroke="#f8fafc" stroke-width="3" />

    <!-- Plato de Fijación del Trípode -->
    <rect x="85" y="233" width="130" height="12" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />

    <!-- Trípode Topográfico de Madera / Fibra de Vidrio de Alta Resistencia -->
    <!-- Pata Izquierda -->
    <line x1="110" y1="245" x2="10" y2="380" stroke="#eab308" stroke-width="8" stroke-linecap="round" />
    <line x1="10" y1="360" x2="5" y2="385" stroke="#0f172a" stroke-width="10" />
    <polygon points="5,385 10,385 7,395" fill="#e2e8f0" />
    <!-- Mordaza de fijación pata izquierda -->
    <rect x="50" y="300" width="15" height="12" rx="2" fill="#ef4444" transform="rotate(30 50 300)" />

    <!-- Pata Central -->
    <line x1="150" y1="245" x2="150" y2="385" stroke="#ca8a04" stroke-width="8" stroke-linecap="round" />
    <line x1="150" y1="365" x2="150" y2="388" stroke="#0f172a" stroke-width="10" />
    <polygon points="146,388 154,388 150,398" fill="#e2e8f0" />
    <!-- Mordaza de fijación pata central -->
    <rect x="143" y="310" width="14" height="12" rx="2" fill="#ef4444" />

    <!-- Pata Derecha -->
    <line x1="190" y1="245" x2="290" y2="380" stroke="#eab308" stroke-width="8" stroke-linecap="round" />
    <line x1="290" y1="360" x2="295" y2="385" stroke="#0f172a" stroke-width="10" />
    <polygon points="295,385 290,385 293,395" fill="#e2e8f0" />
    <!-- Mordaza de fijación pata derecha -->
    <rect x="235" y="300" width="15" height="12" rx="2" fill="#ef4444" transform="rotate(-30 235 300)" />
  </g>

  <!-- Placa Informativa -->
  <g transform="translate(400, 435)">
    <rect x="-190" y="0" width="380" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#ef4444" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">ESTACIÓN TOTAL LÁSER • LEICA TS07</text>
  </g>
</svg>
