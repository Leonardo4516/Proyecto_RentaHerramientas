<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgPlaca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="mikasaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="steelBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <pattern id="gridPlaca" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgPlaca)" />
  <rect width="800" height="500" fill="url(#gridPlaca)" />
  <circle cx="400" cy="240" r="160" fill="rgba(239, 68, 68, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- PLACA COMPACTADORA REVERSIBLE 90KG MIKASA -->
  <g transform="translate(190, 80)">
    <!-- Manillar Guía Plegable con Silentblocks Antivibratorios -->
    <path d="M60 80 L140 220 L180 260" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Empuñadura Ergonómica Acolchada -->
    <path d="M45 80 L75 80" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
    <!-- Palanca Reversible Avance/Retroceso Hidráulico -->
    <line x1="85" y1="120" x2="110" y2="105" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
    <circle cx="112" cy="103" r="5" fill="#ef4444" />

    <!-- Tanque de Agua Extraíble para Asfalto (Con Aspersores) -->
    <path d="M160 140 L260 140 Q275 140 275 155 L275 190 L160 190 Z" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" />
    <text x="215" y="170" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">WATER SPRINKLER</text>

    <!-- Motor Honda GX160 / Mikasa Rojo -->
    <rect x="170" y="190" width="130" height="80" rx="8" fill="url(#mikasaRed)" stroke="#f87171" stroke-width="2" />
    <!-- Filtro de Aire Ciclónico -->
    <rect x="190" y="170" width="35" height="22" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <!-- Tapa de Combustible y Escape -->
    <rect x="255" y="178" width="25" height="14" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1" />
    <text x="235" y="235" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="1">MIKASA</text>
    <text x="235" y="255" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="11" font-weight="bold">MVC-F80</text>

    <!-- Cubierta Protectora de Correa Dentada y Embrague Centrífugo -->
    <path d="M220 250 L340 250 Q360 250 360 275 L360 295 L220 295 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <circle cx="250" cy="275" r="14" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <circle cx="330" cy="275" r="14" fill="#0f172a" stroke="#64748b" stroke-width="2" />

    <!-- Carcasa del Excitador / Eje Vibratorio de Fundición Dúctil -->
    <rect x="230" y="295" width="120" height="25" rx="5" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <!-- Tacos Amortiguadores de Goma de Alta Resistencia -->
    <rect x="180" y="310" width="30" height="15" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <rect x="330" y="310" width="30" height="15" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />

    <!-- Placa Base Curva de Acero Antidesgaste (Bordes Biselados) -->
    <path d="M140 330 L380 330 Q410 330 425 315 L430 325 Q410 345 380 345 L140 345 Q115 345 100 325 L105 315 Q118 330 140 330 Z" fill="url(#steelBase)" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Ruedas de Transporte Plegables Traseras -->
    <g transform="translate(130, 310)">
      <line x1="0" y1="0" x2="-25" y2="25" stroke="#64748b" stroke-width="4" />
      <circle cx="-25" cy="25" r="16" fill="#0f172a" stroke="#e2e8f0" stroke-width="2" />
      <circle cx="-25" cy="25" r="6" fill="#f59e0b" />
    </g>

    <!-- Ondas de Compactación de Suelo (Fuerza Centrífuga 15kN) -->
    <path d="M220 365 Q270 375 320 365" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <path d="M180 380 Q270 395 360 380" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" />
  </g>

  <!-- Placa Informativa -->
  <g transform="translate(400, 435)">
    <rect x="-190" y="0" width="380" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#ef4444" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">PLACA COMPACTADORA 90KG • MIKASA</text>
  </g>
</svg>
