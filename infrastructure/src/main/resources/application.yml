server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: Proyecto_RentaHerramientas

  datasource:
    url: ${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:${DB_URL:${SUPABASE_DB_URL:jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5432}}/${DB_NAME:${POSTGRES_DB:renta_herramientas_db}}}}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:${SUPABASE_DB_USER:${POSTGRES_USER:postgres}}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${SUPABASE_DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

jwt:
  secret: ${JWT_SECRET:RentaToolsUltraSecretSigningKeyMustBeAtLeast256BitsLongForHmacSha256Security!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:5500}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.rentatools: DEBUG
    org.springframework.security: INFO
