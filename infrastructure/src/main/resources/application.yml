server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: Proyecto_RentaHerramientas

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:${JDBC_DATABASE_URL:${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/renta_herramientas_db}}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:${POSTGRES_USER:${SUPABASE_DB_USER:postgres}}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:${SUPABASE_DB_PASSWORD:postgres}}}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_DEFAULT_SCHEMA:public}

jwt:
  secret: ${JWT_SECRET:RentaToolsUltraSecretSigningKeyMustBeAtLeast256BitsLongForHmacSha256Security!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8081,http://localhost:8085,http://127.0.0.1:5500}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.rentatools: DEBUG
    org.springframework.security: INFO
