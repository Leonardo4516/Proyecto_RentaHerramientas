server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rentatools-infrastructure
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:renta_herramientas_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: RentaToolsUltraSecretSigningKeyMustBeAtLeast256BitsLongForHmacSha256Security!
  expiration-ms: 86400000 # 24 horas

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.rentatools: DEBUG
    org.springframework.security: INFO
