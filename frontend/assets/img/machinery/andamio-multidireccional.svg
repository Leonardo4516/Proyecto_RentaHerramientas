<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgAnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="galvaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="gridAnd" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgAnd)" />
  <rect width="800" height="500" fill="url(#gridAnd)" />
  <circle cx="400" cy="240" r="160" fill="rgba(6, 182, 212, 0.04)" />
  <line x1="60" y1="440" x2="740" y2="440" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- TORRE DE ANDAMIO CERTIFICADO MULTIDIRECCIONAL (KIT 20m²) -->
  <g transform="translate(260, 60)">
    <!-- Rosetas de Acero en Estándares Verticales -->
    <!-- Estándar Izquierdo Vertical (Ø 48.3 mm) -->
    <rect x="40" y="20" width="8" height="380" rx="2" fill="url(#galvaGrad)" />
    <!-- Estándar Derecho Vertical (Ø 48.3 mm) -->
    <rect x="232" y="20" width="8" height="380" rx="2" fill="url(#galvaGrad)" />

    <!-- Rosetas Multidireccionales cada 50cm -->
    <g fill="#cbd5e1" stroke="#475569" stroke-width="1">
      <circle cx="44" cy="60" r="9" />
      <circle cx="236" cy="60" r="9" />
      <circle cx="44" cy="140" r="9" />
      <circle cx="236" cy="140" r="9" />
      <circle cx="44" cy="220" r="9" />
      <circle cx="236" cy="220" r="9" />
      <circle cx="44" cy="300" r="9" />
      <circle cx="236" cy="300" r="9" />
      <circle cx="44" cy="380" r="9" />
      <circle cx="236" cy="380" r="9" />
    </g>

    <!-- Largueros Horizontales Principales -->
    <rect x="44" y="58" width="192" height="6" rx="2" fill="url(#galvaGrad)" />
    <rect x="44" y="138" width="192" height="6" rx="2" fill="url(#galvaGrad)" />
    <rect x="44" y="218" width="192" height="6" rx="2" fill="url(#galvaGrad)" />
    <rect x="44" y="298" width="192" height="6" rx="2" fill="url(#galvaGrad)" />
    <rect x="44" y="378" width="192" height="6" rx="2" fill="url(#galvaGrad)" />

    <!-- Diagonales Rigidizadoras Cruzadas de Seguridad -->
    <!-- Módulo 1 (Superior) -->
    <line x1="44" y1="60" x2="236" y2="140" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="236" y1="60" x2="44" y2="140" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />

    <!-- Módulo 2 (Medio) -->
    <line x1="44" y1="140" x2="236" y2="220" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="236" y1="140" x2="44" y2="220" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />

    <!-- Módulo 3 (Inferior) -->
    <line x1="44" y1="220" x2="236" y2="300" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="236" y1="220" x2="44" y2="300" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />

    <!-- Plataformas Metálicas de Trabajo Antideslizantes -->
    <!-- Plataforma Superior con Trampilla de Acceso -->
    <rect x="30" y="132" width="220" height="8" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Rodapié de Madera / Seguridad Perimetral -->
    <rect x="30" y="122" width="220" height="10" rx="1" fill="url(#amberAccent)" />
    <!-- Baranda de Seguridad Triple Superior -->
    <line x1="40" y1="90" x2="240" y2="90" stroke="#38bdf8" stroke-width="3" />
    <line x1="40" y1="105" x2="240" y2="105" stroke="#38bdf8" stroke-width="2" />

    <!-- Escalera Interior Integrada -->
    <g transform="translate(180, 140)">
      <line x1="0" y1="0" x2="30" y2="160" stroke="#94a3b8" stroke-width="3" />
      <line x1="20" y1="0" x2="50" y2="160" stroke="#94a3b8" stroke-width="3" />
      <line x1="4" y1="20" x2="24" y2="20" stroke="#f8fafc" stroke-width="2" />
      <line x1="8" y1="45" x2="28" y2="45" stroke="#f8fafc" stroke-width="2" />
      <line x1="12" y1="70" x2="32" y2="70" stroke="#f8fafc" stroke-width="2" />
      <line x1="16" y1="95" x2="36" y2="95" stroke="#f8fafc" stroke-width="2" />
      <line x1="20" y1="120" x2="40" y2="120" stroke="#f8fafc" stroke-width="2" />
      <line x1="24" y1="145" x2="44" y2="145" stroke="#f8fafc" stroke-width="2" />
    </g>

    <!-- Husillos Niveladores Roscados y Placas Base en Suelo -->
    <!-- Base Izquierda -->
    <rect x="38" y="395" width="12" height="35" rx="1" fill="#475569" stroke="#cbd5e1" stroke-width="1" />
    <!-- Manivela roscada husillo -->
    <rect x="32" y="408" width="24" height="6" rx="2" fill="#f59e0b" />
    <!-- Placa de acero de apoyo 150x150 mm -->
    <rect x="24" y="426" width="40" height="8" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Base Derecha -->
    <rect x="230" y="395" width="12" height="35" rx="1" fill="#475569" stroke="#cbd5e1" stroke-width="1" />
    <rect x="224" y="408" width="24" height="6" rx="2" fill="#f59e0b" />
    <rect x="216" y="426" width="40" height="8" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Placa Técnica Superior -->
  <rect x="40" y="35" width="280" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
  <circle cx="60" cy="53" r="6" fill="#f59e0b" />
  <text x="76" y="58" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">ANDAMIO CERTIFICADO · EN 12810</text>

  <!-- Badge Seguridad -->
  <g transform="translate(620, 35)">
    <rect width="140" height="36" rx="8" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1.2" />
    <text x="70" y="23" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">KIT 20M² SEGURO</text>
  </g>
</svg>
