<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgPump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="hondaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="pumpCast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="gridPump" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgPump)" />
  <rect width="800" height="500" fill="url(#gridPump)" />
  <circle cx="400" cy="240" r="160" fill="rgba(220, 38, 38, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- MOTOBOMBA DE LODOS HONDA WT30X -->
  <g transform="translate(180, 90)">
    <!-- Jaula Tubular Protectora Negra -->
    <rect x="50" y="50" width="360" height="260" rx="20" fill="none" stroke="#0f172a" stroke-width="14" />
    <rect x="50" y="50" width="360" height="260" rx="20" fill="none" stroke="#334155" stroke-width="6" />
    <!-- Soportes Centrales Jaula -->
    <line x1="170" y1="50" x2="170" y2="310" stroke="#334155" stroke-width="6" />
    <line x1="280" y1="50" x2="280" y2="310" stroke="#334155" stroke-width="6" />

    <!-- Tacos de Goma Antivibración -->
    <rect x="70" y="305" width="40" height="15" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <rect x="350" y="305" width="40" height="15" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2" />

    <!-- Motor Honda GX Rojo (Izquierda) -->
    <!-- Tanque de Combustible Rojo -->
    <path d="M80 80 L180 80 Q190 80 190 95 L190 140 Q190 150 180 150 L80 150 Q70 150 70 140 L70 95 Q70 80 80 80 Z" fill="url(#hondaRed)" stroke="#ef4444" stroke-width="2" />
    <!-- Tapa de Combustible -->
    <rect x="120" y="70" width="30" height="10" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="130" y="125" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="1">HONDA</text>
    
    <!-- Bloque de Motor Metálico -->
    <rect x="80" y="150" width="110" height="120" rx="8" fill="#334155" stroke="#64748b" stroke-width="2" />
    <!-- Tirador de Arranque Retráctil -->
    <circle cx="110" cy="210" r="28" fill="#1e293b" stroke="#dc2626" stroke-width="3" />
    <circle cx="110" cy="210" r="10" fill="#dc2626" />
    <path d="M125 185 L145 170" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />

    <!-- Cuerpo Bomba de Lodos Fundición de Aluminio (Derecha) -->
    <circle cx="280" cy="200" r="75" fill="url(#pumpCast)" stroke="#94a3b8" stroke-width="3" />
    <circle cx="280" cy="200" r="55" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" />
    
    <!-- Brida de Descarga Superior (3 pulgadas) -->
    <path d="M260 125 L300 125 L305 85 L255 85 Z" fill="url(#pumpCast)" stroke="#94a3b8" stroke-width="2" />
    <rect x="250" y="80" width="60" height="12" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5" />
    <ellipse cx="280" cy="86" rx="20" ry="4" fill="#0f172a" />
    <!-- Flecha de Flujo Salida -->
    <path d="M280 65 L280 40 M273 50 L280 40 L287 50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Brida de Succión Frontal (3 pulgadas) -->
    <circle cx="280" cy="200" r="32" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" />
    <!-- Pernos de la Tapa de Limpieza Rápida T-Bolt -->
    <line x1="280" y1="145" x2="280" y2="160" stroke="#f59e0b" stroke-width="4" />
    <line x1="280" y1="240" x2="280" y2="255" stroke="#f59e0b" stroke-width="4" />
    <line x1="225" y1="200" x2="240" y2="200" stroke="#f59e0b" stroke-width="4" />
    <line x1="320" y1="200" x2="335" y2="200" stroke="#f59e0b" stroke-width="4" />
    <!-- Manijas T de Inspección Fácil -->
    <rect x="265" y="140" width="30" height="8" rx="2" fill="#f59e0b" />
    <rect x="265" y="250" width="30" height="8" rx="2" fill="#f59e0b" />
    
    <!-- Conector de Succión Saliente -->
    <circle cx="280" cy="200" r="18" fill="#334155" stroke="#38bdf8" stroke-width="2" />
    <text x="280" y="205" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">3" IN</text>
  </g>

  <!-- Placa Informativa -->
  <g transform="translate(400, 435)">
    <rect x="-190" y="0" width="380" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#dc2626" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">MOTOBOMBA DE LODOS 3" • HONDA WT30X</text>
  </g>
</svg>
