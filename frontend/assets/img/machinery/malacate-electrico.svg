<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgMal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="imerYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="drumCable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <pattern id="gridMal" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgMal)" />
  <rect width="800" height="500" fill="url(#gridMal)" />
  <circle cx="400" cy="240" r="160" fill="rgba(245, 158, 11, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- MALACATE ELÉCTRICO DE OBRA CON BRAZO GIRATORIO IMER -->
  <g transform="translate(180, 50)">
    <!-- Columna / Puntal Telescópico de Fijación Techo-Suelo -->
    <rect x="70" y="30" width="24" height="340" rx="4" fill="#334155" stroke="#64748b" stroke-width="2" />
    <!-- Husillo Roscado Superior de Presión -->
    <rect x="62" y="20" width="40" height="12" rx="3" fill="#e2e8f0" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="82" y1="10" x2="82" y2="20" stroke="#f59e0b" stroke-width="6" />
    <rect x="52" y="2" width="60" height="8" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Base Inferior de Apoyo -->
    <rect x="52" y="370" width="60" height="12" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Abrazaderas Giratorias del Brazo Telescópico -->
    <circle cx="82" cy="110" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />
    <circle cx="82" cy="190" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />

    <!-- Brazo Voladizo Extensible de Acero Triangular -->
    <path d="M82 110 L380 110 L380 130 L82 190 Z" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round" />
    <!-- Celosía de Refuerzo del Brazo -->
    <line x1="160" y1="110" x2="160" y2="175" stroke="#f59e0b" stroke-width="2" />
    <line x1="240" y1="110" x2="240" y2="158" stroke="#f59e0b" stroke-width="2" />
    <line x1="320" y1="110" x2="320" y2="142" stroke="#f59e0b" stroke-width="2" />
    <line x1="160" y1="175" x2="240" y2="110" stroke="#f59e0b" stroke-width="2" />
    <line x1="240" y1="158" x2="320" y2="110" stroke="#f59e0b" stroke-width="2" />

    <!-- Carro / Unidad Motriz Elevadora (Motor Eléctrico Autofrenante) -->
    <!-- Carcasa Amarilla Motor Imer -->
    <rect x="180" y="55" width="120" height="50" rx="8" fill="url(#imerYellow)" stroke="#b45309" stroke-width="2" />
    <text x="240" y="85" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="900" letter-spacing="1">IMER 500KG</text>

    <!-- Tambor con Cable de Acero Antigiratorio (30m) -->
    <rect x="290" y="60" width="55" height="42" rx="4" fill="url(#drumCable)" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="295" y1="81" x2="340" y2="81" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="2 2" />

    <!-- Polea Guía en Punta de Pluma -->
    <circle cx="380" cy="120" r="16" fill="#0f172a" stroke="#e2e8f0" stroke-width="3" />
    <circle cx="380" cy="120" r="6" fill="#f59e0b" />

    <!-- Cable de Acero Suspendido con Tope Fin de Carrera -->
    <line x1="380" y1="136" x2="380" y2="280" stroke="#cbd5e1" stroke-width="4" />
    <!-- Pesa / Bola Contrapeso y Fin de Carrera -->
    <circle cx="380" cy="275" r="14" fill="#ef4444" stroke="#991b1b" stroke-width="2" />

    <!-- Gancho Forjado Giratorio con Lengüeta de Seguridad -->
    <g transform="translate(380, 290)">
      <circle cx="0" cy="5" r="7" fill="none" stroke="#64748b" stroke-width="3" />
      <path d="M0 12 C10 12 18 20 18 30 C18 42 -5 45 -12 32 C-15 25 -10 18 0 18" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
      <line x1="-1" y1="14" x2="-10" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <!-- Carga Suspendida: Balde / Cubo de Hormigón -->
      <path d="M-25 55 L25 55 L18 95 L-18 95 Z" fill="#1e293b" stroke="#64748b" stroke-width="2" />
      <!-- Asa de Balde -->
      <path d="M-22 55 Q0 35 0 35 Q0 35 22 55" fill="none" stroke="#cbd5e1" stroke-width="3" />
      <text x="0" y="80" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="bold">CAP. 500 KG</text>
    </g>

    <!-- Botonera Colgante de Mando a Distancia (Baja Tensión 24V con Paro Emergencia) -->
    <path d="M190 105 Q170 140 150 180" fill="none" stroke="#0f172a" stroke-width="3" stroke-dasharray="3 3" />
    <g transform="translate(140, 180)">
      <rect x="0" y="0" width="22" height="60" rx="5" fill="#eab308" stroke="#ca8a04" stroke-width="1.5" />
      <circle cx="11" cy="12" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1" /> <!-- Paro de Emergencia -->
      <circle cx="11" cy="28" r="4" fill="#0f172a" /> <!-- Subida -->
      <circle cx="11" cy="44" r="4" fill="#0f172a" /> <!-- Bajada -->
    </g>
  </g>

  <!-- Placa Informativa -->
  <g transform="translate(400, 435)">
    <rect x="-190" y="0" width="380" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">MALACATE ELÉCTRICO 500KG • IMER AIRONE</text>
  </g>
</svg>
