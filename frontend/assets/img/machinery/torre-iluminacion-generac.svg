<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgGen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="genOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <pattern id="gridGen" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGen)" />
  <rect width="800" height="500" fill="url(#gridGen)" />

  <!-- Haces de Luz LED Proyectados hacia Abajo -->
  <polygon points="340,90 120,440 280,440" fill="url(#lightBeam)" />
  <polygon points="460,90 520,440 680,440" fill="url(#lightBeam)" />

  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- TORRE DE ILUMINACIÓN GENERAC 6kW -->
  <g transform="translate(240, 50)">
    <!-- Focos LED Superiores (4 Módulos de Alta Intensidad) -->
    <g transform="translate(140, 30)">
      <!-- Barra soporte de proyectores -->
      <rect x="-80" y="0" width="160" height="10" rx="3" fill="#334155" />
      
      <!-- Foco 1 (Izquierda exterior) -->
      <rect x="-75" y="10" width="30" height="24" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="-60" cy="22" r="8" fill="#fef08a" />
      
      <!-- Foco 2 (Izquierda interior) -->
      <rect x="-35" y="10" width="30" height="24" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="-20" cy="22" r="8" fill="#fef08a" />
      
      <!-- Foco 3 (Derecha interior) -->
      <rect x="5" y="10" width="30" height="24" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="20" cy="22" r="8" fill="#fef08a" />
      
      <!-- Foco 4 (Derecha exterior) -->
      <rect x="45" y="10" width="30" height="24" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="60" cy="22" r="8" fill="#fef08a" />
    </g>

    <!-- Mástil Telescópico Galvanizado (9 Metros) -->
    <!-- Sección Superior Delgado -->
    <rect x="135" y="40" width="10" height="90" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1" />
    <!-- Sección Media -->
    <rect x="132" y="125" width="16" height="95" fill="#64748b" stroke="#94a3b8" stroke-width="1" />
    <!-- Sección Base Reforzada -->
    <rect x="128" y="215" width="24" height="100" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <!-- Cabrestante manual con cable de acero -->
    <circle cx="152" cy="250" r="10" fill="#0f172a" stroke="#94a3b8" stroke-width="2" />
    <line x1="152" y1="250" x2="162" y2="242" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

    <!-- Gabinete del Generador Diésel Generac Insonorizado -->
    <rect x="50" y="270" width="180" height="95" rx="8" fill="url(#genOrange)" stroke="#0f172a" stroke-width="2" />
    <rect x="70" y="285" width="140" height="50" rx="4" fill="#0f172a" />
    <!-- Rejillas de Ventilación Acústica -->
    <line x1="85" y1="298" x2="195" y2="298" stroke="#f97316" stroke-width="2" />
    <line x1="85" y1="310" x2="195" y2="310" stroke="#f97316" stroke-width="2" />
    <line x1="85" y1="322" x2="195" y2="322" stroke="#f97316" stroke-width="2" />
    <!-- Panel de Control y Parada de Emergencia -->
    <circle cx="60" cy="300" r="5" fill="#ef4444" />
    <circle cx="60" cy="318" r="4" fill="#10b981" />

    <!-- Estabilizadores Telescópicos / Patas de Nivelación -->
    <line x1="60" y1="350" x2="-10" y2="370" stroke="#475569" stroke-width="8" stroke-linecap="round" />
    <rect x="-20" y="366" width="20" height="6" rx="2" fill="#0f172a" />
    <line x1="220" y1="350" x2="290" y2="370" stroke="#475569" stroke-width="8" stroke-linecap="round" />
    <rect x="280" y="366" width="20" height="6" rx="2" fill="#0f172a" />

    <!-- Remolque y Ruedas -->
    <rect x="20" y="355" width="240" height="12" rx="4" fill="#1e293b" />
    <!-- Lanza de Arrastre -->
    <line x1="260" y1="360" x2="330" y2="368" stroke="#334155" stroke-width="8" />
    <circle cx="335" cy="369" r="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />

    <!-- Rueda de Transporte -->
    <circle cx="140" cy="370" r="32" fill="#0f172a" stroke="#334155" stroke-width="8" />
    <circle cx="140" cy="370" r="16" fill="#94a3b8" />
    <circle cx="140" cy="370" r="6" fill="#0f172a" />
  </g>

  <!-- Placa Técnica Superior -->
  <rect x="40" y="35" width="260" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
  <circle cx="60" cy="53" r="6" fill="#f59e0b" />
  <text x="76" y="58" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">GENERAC 6kW · 4x LED 350W</text>

  <!-- Badge Autonomía -->
  <g transform="translate(620, 35)">
    <rect width="140" height="36" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2" />
    <text x="70" y="23" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">AUTONOMÍA 60H</text>
  </g>
</svg>
