<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgRoller" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dynYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="dynRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="drumMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="gridRoller" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgRoller)" />
  <rect width="800" height="500" fill="url(#gridRoller)" />
  <circle cx="400" cy="240" r="160" fill="rgba(234, 179, 8, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- RODILLO VIBROCOMPACTADOR TÁNDEM DYNAPAC CC1200 -->
  <g transform="translate(160, 90)">
    <!-- Barra de Protección Antivuelco ROPS Plegable -->
    <path d="M250 50 L270 50 L280 180 L235 180 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <circle cx="260" cy="50" r="10" fill="#dc2626" />
    <path d="M220 50 L290 50" stroke="#f59e0b" stroke-width="4" />
    <!-- Baliza Estroboscópica Ámbar -->
    <rect x="252" y="32" width="16" height="18" rx="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />

    <!-- Puesto de Conducción / Asiento del Operador -->
    <rect x="200" y="130" width="35" height="45" rx="5" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Volante de Dirección -->
    <line x1="285" y1="140" x2="265" y2="160" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <circle cx="288" cy="138" r="12" fill="none" stroke="#f59e0b" stroke-width="3" />

    <!-- Carrocería Trasera y Tanque de Agua -->
    <path d="M90 170 L250 170 L250 250 L90 250 Z" fill="url(#dynYellow)" stroke="#a16207" stroke-width="2" />
    <!-- Capó / Cubierta Motor -->
    <path d="M250 170 L390 190 L390 250 L250 250 Z" fill="url(#dynYellow)" stroke="#a16207" stroke-width="2" />
    <text x="320" y="225" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="900" letter-spacing="1">DYNAPAC</text>
    
    <!-- Articulación Central Oscilante de Chasis -->
    <rect x="240" y="220" width="20" height="45" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <circle cx="250" cy="242" r="6" fill="#f59e0b" />

    <!-- Bastidor y Rascadores de Rodillo Trasero -->
    <path d="M70 250 L170 250 L155 315 L85 315 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Tambor / Cilindro Vibratorio Trasero -->
    <g transform="translate(120, 290)">
      <circle cx="0" cy="0" r="55" fill="url(#drumMetal)" stroke="#94a3b8" stroke-width="4" />
      <circle cx="0" cy="0" r="28" fill="#ca8a04" stroke="#fef08a" stroke-width="2" />
      <circle cx="0" cy="0" r="10" fill="#0f172a" />
      <!-- Boquillas Rociadoras de Agua -->
      <line x1="-55" y1="-25" x2="-45" y2="-25" stroke="#38bdf8" stroke-width="4" />
    </g>

    <!-- Bastidor y Rascadores de Rodillo Delantero -->
    <path d="M320 250 L420 250 L405 315 L335 315 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Tambor / Cilindro Vibratorio Delantero -->
    <g transform="translate(370, 290)">
      <circle cx="0" cy="0" r="55" fill="url(#drumMetal)" stroke="#94a3b8" stroke-width="4" />
      <circle cx="0" cy="0" r="28" fill="#ca8a04" stroke="#fef08a" stroke-width="2" />
      <circle cx="0" cy="0" r="10" fill="#0f172a" />
      <!-- Boquillas Rociadoras de Agua -->
      <line x1="45" y1="-25" x2="55" y2="-25" stroke="#38bdf8" stroke-width="4" />
    </g>
  </g>

  <!-- Placa Informativa -->
  <g transform="translate(400, 435)">
    <rect x="-190" y="0" width="380" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#eab308" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">RODILLO VIBROCOMPACTADOR • DYNAPAC CC1200</text>
  </g>
</svg>
