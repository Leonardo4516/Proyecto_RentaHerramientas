<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgBosch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boschBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="boschRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="metalChisel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <pattern id="gridBosch" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <filter id="impactGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgBosch)" />
  <rect width="800" height="500" fill="url(#gridBosch)" />
  <circle cx="400" cy="250" r="170" fill="rgba(2, 132, 199, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- TALADRO DEMOLEDOR BOSCH GSH 16-28 (HEX 28mm) -->
  <g transform="translate(240, 100) rotate(-35 150 150)">
    <!-- Mango Superior con Amortiguación Vibration Control -->
    <path d="M80 60 C80 30, 220 30, 220 60 L220 100 C220 100, 200 90, 180 100 L180 70 C180 60, 120 60, 120 70 L120 100 C100 90, 80 100, 80 100 Z" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
    <rect x="135" y="75" width="30" height="14" rx="4" fill="url(#boschRed)" />
    <!-- Gatillo de Encendido Ergonómico -->
    <path d="M142 89 L142 102 L158 102 L158 89 Z" fill="#f8fafc" />

    <!-- Carcasa del Motor Eléctrico 1750W (Azul Bosch Professional) -->
    <rect x="90" y="100" width="120" height="110" rx="10" fill="url(#boschBlue)" stroke="#0f172a" stroke-width="3" />
    <!-- Rejillas de Refrigeración de Alta Eficiencia -->
    <line x1="110" y1="120" x2="190" y2="120" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <line x1="110" y1="135" x2="190" y2="135" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <line x1="110" y1="150" x2="190" y2="150" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    
    <!-- Placa de Marca Bosch -->
    <rect x="115" y="168" width="70" height="22" rx="4" fill="#0f172a" />
    <text x="150" y="184" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">BOSCH</text>

    <!-- Asa Lateral Auxiliar Orientable 360° -->
    <path d="M50 140 C20 140, 20 180, 50 180 L90 170 L90 150 Z" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />

    <!-- Caja de Engranajes de Aluminio / Mecanismo Neumático de Percusión -->
    <path d="M110 210 L190 210 L180 290 L120 290 Z" fill="#64748b" stroke="#334155" stroke-width="3" />
    <line x1="125" y1="240" x2="175" y2="240" stroke="#94a3b8" stroke-width="3" />
    <line x1="128" y1="265" x2="172" y2="265" stroke="#94a3b8" stroke-width="3" />

    <!-- Portaherramientas Hexagonal HEX 28mm con Cierre Rápido -->
    <rect x="130" y="290" width="40" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect x="125" y="305" width="50" height="12" rx="3" fill="#cbd5e1" />

    <!-- Puntero Cincel Hexagonal Templado (Longitud 400mm) -->
    <path d="M142 330 L158 330 L154 440 L150 460 L146 440 Z" fill="url(#metalChisel)" stroke="#334155" stroke-width="1.5" />
    <!-- Filo del Cincel -->
    <polygon points="150,460 144,450 156,450" fill="#facc15" />

    <!-- Cable de Alimentación de Uso Rudo Reforzado -->
    <path d="M150 40 C150 10, 170 0, 200 5 C230 10, 240 -20, 260 -15" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Chispas / Impacto de Demolición en la Punta -->
  <g transform="translate(485, 410)" filter="url(#impactGlow)">
    <line x1="0" y1="0" x2="25" y2="-20" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-20" y2="-25" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="0" x2="30" y2="5" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-25" y2="10" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="10" y2="-35" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#fef08a" />
  </g>

  <!-- Placa Técnica Superior -->
  <rect x="40" y="35" width="290" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
  <circle cx="60" cy="53" r="6" fill="#f59e0b" />
  <text x="76" y="58" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">BOSCH GSH 16-28 · 41 JOULES</text>

  <!-- Badge Rendimiento -->
  <g transform="translate(620, 35)">
    <rect width="140" height="36" rx="8" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1.2" />
    <text x="70" y="23" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">13 TON / DÍA</text>
  </g>
</svg>
