<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="toolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="toolGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#toolBg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Halo de resplandor -->
  <circle cx="400" cy="220" r="140" fill="rgba(245, 158, 11, 0.06)" />

  <!-- Silueta de Maquinaria -->
  <g transform="translate(340, 150) scale(3)" fill="url(#toolGold)">
    <path d="M5 22h30v4H5zM8 18h24v2H8z"/>
    <path d="M12 10h16v6H12z"/>
    <path d="M22 6h8l4 8h-4z"/>
    <circle cx="10" cy="24" r="3" fill="#0f172a"/>
    <circle cx="20" cy="24" r="3" fill="#0f172a"/>
    <circle cx="30" cy="24" r="3" fill="#0f172a"/>
  </g>

  <!-- Tipografía -->
  <text x="400" y="340" text-anchor="middle" fill="#f8fafc" font-family="'Montserrat', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="1">RENTATOOLS PRO</text>
  <text x="400" y="375" text-anchor="middle" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="15">Fotografía de Maquinaria en Calidad Certificada</text>
  <text x="400" y="410" text-anchor="middle" fill="#f59e0b" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Guarda tus fotos en: /assets/img/machinery/</text>
</svg>
