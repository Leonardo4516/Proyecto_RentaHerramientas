<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgBob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="whiteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="orangeBob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="gridBob" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgBob)" />
  <rect width="800" height="500" fill="url(#gridBob)" />
  <circle cx="400" cy="240" r="160" fill="rgba(234, 88, 12, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- MINICARGADOR BOBCAT S570 -->
  <g transform="translate(180, 80)">
    <!-- Chasis Principal y Carrocería Bobcat -->
    <path d="M120 180 L280 180 L290 260 L80 260 L90 200 Z" fill="url(#whiteBody)" stroke="#94a3b8" stroke-width="2" />
    <!-- Franja Naranja Bobcat Distintiva -->
    <path d="M100 200 L285 200 L287 220 L95 220 Z" fill="url(#orangeBob)" />

    <!-- Cabina ROPS/FOPS Antivuelco -->
    <path d="M150 80 L240 80 L260 180 L130 180 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="3" />
    <!-- Malla de Protección y Ventanilla -->
    <path d="M160 95 L230 95 L245 170 L145 170 Z" fill="rgba(6, 182, 212, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="160" y1="130" x2="240" y2="130" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="195" y1="95" x2="195" y2="170" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Brazo Elevador Hidráulico de Carga Radial -->
    <path d="M100 130 L180 130 L320 220 L350 250 L330 260 L170 150 L95 150 Z" fill="url(#orangeBob)" stroke="#7c2d12" stroke-width="2" />
    <!-- Cilindro Hidráulico de Elevación -->
    <rect x="180" y="180" width="70" height="12" rx="4" transform="rotate(35 180 180)" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />

    <!-- Cucharón Frontal para Servicio Pesado -->
    <path d="M340 240 L410 240 L430 300 L330 300 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />
    <!-- Dientes de Cucharón -->
    <polygon points="430,300 445,300 440,290" fill="#f59e0b" />
    <polygon points="410,300 425,300 420,290" fill="#f59e0b" />
    <polygon points="390,300 405,300 400,290" fill="#f59e0b" />

    <!-- Ruedas Neumáticas Todo Terreno Heavy Duty (4x4) -->
    <!-- Rueda Trasera -->
    <g transform="translate(130, 270)">
      <circle cx="0" cy="0" r="48" fill="url(#tireGrad)" stroke="#64748b" stroke-width="3" />
      <circle cx="0" cy="0" r="28" fill="#ea580c" stroke="#f8fafc" stroke-width="2" />
      <circle cx="0" cy="0" r="10" fill="#0f172a" />
      <rect x="-46" y="-6" width="12" height="12" fill="#475569" />
      <rect x="34" y="-6" width="12" height="12" fill="#475569" />
      <rect x="-6" y="-46" width="12" height="12" fill="#475569" />
      <rect x="-6" y="34" width="12" height="12" fill="#475569" />
    </g>

    <!-- Rueda Delantera -->
    <g transform="translate(260, 270)">
      <circle cx="0" cy="0" r="48" fill="url(#tireGrad)" stroke="#64748b" stroke-width="3" />
      <circle cx="0" cy="0" r="28" fill="#ea580c" stroke="#f8fafc" stroke-width="2" />
      <circle cx="0" cy="0" r="10" fill="#0f172a" />
      <rect x="-46" y="-6" width="12" height="12" fill="#475569" />
      <rect x="34" y="-6" width="12" height="12" fill="#475569" />
      <rect x="-6" y="-46" width="12" height="12" fill="#475569" />
      <rect x="-6" y="34" width="12" height="12" fill="#475569" />
    </g>

    <!-- Focos de Trabajo LED -->
    <circle cx="245" cy="88" r="6" fill="#fef08a" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="155" cy="88" r="6" fill="#fef08a" stroke="#f59e0b" stroke-width="1.5" />
  </g>

  <!-- Ficha Técnica Inferior -->
  <text x="400" y="445" text-anchor="middle" fill="#f8fafc" font-family="'Montserrat', system-ui, sans-serif" font-size="20" font-weight="800">MINICARGADOR BOBCAT S570</text>
  <text x="400" y="470" text-anchor="middle" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="13">Capacidad Operativa 885 kg • Motor Diésel 61 hp • Tracción 4x4 Skid Steer</text>
</svg>
