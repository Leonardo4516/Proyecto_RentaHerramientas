<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgGenie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="genieBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <pattern id="gridGenie" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGenie)" />
  <rect width="800" height="500" fill="url(#gridGenie)" />
  <circle cx="400" cy="240" r="160" fill="rgba(2, 132, 199, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- PLATAFORMA DE TIJERA ELÉCTRICA GENIE GS-1930 -->
  <g transform="translate(230, 50)">
    <!-- Plataforma y Barandillas Superiores Elevadas -->
    <rect x="20" y="30" width="280" height="60" fill="none" stroke="#0284c7" stroke-width="3" />
    <!-- Barandilla Intermedia y Rodapié -->
    <line x1="20" y1="60" x2="300" y2="60" stroke="#38bdf8" stroke-width="2" />
    <rect x="20" y="80" width="280" height="15" fill="#f59e0b" stroke="#d97706" stroke-width="1" />
    <!-- Caja de Control de Operación Superior / Joystick -->
    <rect x="260" y="35" width="25" height="30" rx="3" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="272" cy="45" r="4" fill="#ef4444" />
    <line x1="272" y1="35" x2="272" y2="25" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Piso Antideslizante Plataforma -->
    <rect x="15" y="90" width="290" height="12" rx="3" fill="#334155" stroke="#64748b" stroke-width="2" />

    <!-- Mecanismo de Tijeras Pantógrafo (3 Niveles de Elevación) -->
    <!-- Nivel Superior -->
    <line x1="40" y1="102" x2="280" y2="160" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <line x1="280" y1="102" x2="40" y2="160" stroke="#0369a1" stroke-width="7" stroke-linecap="round" />
    <circle cx="160" cy="131" r="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2" />

    <!-- Nivel Medio -->
    <line x1="40" y1="160" x2="280" y2="218" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <line x1="280" y1="160" x2="40" y2="218" stroke="#0369a1" stroke-width="7" stroke-linecap="round" />
    <circle cx="160" cy="189" r="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2" />

    <!-- Nivel Inferior -->
    <line x1="40" y1="218" x2="280" y2="276" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <line x1="280" y1="218" x2="40" y2="276" stroke="#0369a1" stroke-width="7" stroke-linecap="round" />
    <circle cx="160" cy="247" r="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2" />

    <!-- Cilindro Hidráulico de Elevación Central -->
    <line x1="100" y1="240" x2="210" y2="140" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
    <line x1="120" y1="220" x2="230" y2="120" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

    <!-- Chasis Base con Compartimiento de Baterías de Tracción -->
    <rect x="25" y="276" width="270" height="60" rx="8" fill="url(#genieBlue)" stroke="#0284c7" stroke-width="2" />
    <text x="160" y="312" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="2">Genie GS-1930</text>
    
    <!-- Bolsillos para Horquillas Montacargas -->
    <rect x="80" y="318" width="45" height="14" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <rect x="195" y="318" width="45" height="14" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />

    <!-- Sistema de Protección Antibaches (Pothole Protection) -->
    <rect x="40" y="336" width="240" height="8" rx="2" fill="#f59e0b" />

    <!-- Ruedas Macizas que No Dejan Huellas (Non-Marking Solid Tires) -->
    <!-- Rueda Delantera -->
    <circle cx="65" cy="350" r="24" fill="#e2e8f0" stroke="#64748b" stroke-width="3" />
    <circle cx="65" cy="350" r="10" fill="#0369a1" />
    <!-- Rueda Trasera -->
    <circle cx="255" cy="350" r="24" fill="#e2e8f0" stroke="#64748b" stroke-width="3" />
    <circle cx="255" cy="350" r="10" fill="#0369a1" />
  </g>

  <!-- Placa Informativa -->
  <g transform="translate(400, 435)">
    <rect x="-190" y="0" width="380" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#0284c7" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">PLATAFORMA TIJERA 8M • GENIE GS-1930</text>
  </g>
</svg>
