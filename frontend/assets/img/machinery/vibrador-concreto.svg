<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgVib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wackerYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="gridVib" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgVib)" />
  <rect width="800" height="500" fill="url(#gridVib)" />
  <circle cx="400" cy="240" r="160" fill="rgba(245, 158, 11, 0.05)" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- VIBRADOR DE CONCRETO / AGUJA Y UNIDAD MOTRIZ -->
  <g transform="translate(160, 90)">
    <!-- Base Giratoria Jaula / Chasis Tubular Motor -->
    <circle cx="120" cy="250" r="85" fill="none" stroke="#334155" stroke-width="8" />
    <circle cx="120" cy="250" r="60" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="12 8" />

    <!-- Motor a Gasolina 5.5 HP 4 Tiempos -->
    <rect x="70" y="160" width="100" height="90" rx="8" fill="url(#wackerYellow)" stroke="#b45309" stroke-width="2" />
    <!-- Tanque de Combustible Negro -->
    <rect x="75" y="135" width="85" height="30" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <circle cx="115" cy="130" r="8" fill="#e2e8f0" />
    <!-- Arrancador Manual con Piola -->
    <circle cx="120" cy="205" r="22" fill="#1e293b" stroke="#e2e8f0" stroke-width="2" />

    <!-- Acople Rápido Tipo Muela Dynapac / Wacker -->
    <rect x="170" y="195" width="30" height="30" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
    <circle cx="185" cy="210" r="8" fill="#f59e0b" />

    <!-- Manguera Flexible Reforzada con Alambre de Acero (5 Metros) -->
    <path d="M200 210 Q280 200 300 270 Q320 340 380 280 Q430 220 490 270" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
    <path d="M200 210 Q280 200 300 270 Q320 340 380 280 Q430 220 490 270" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="8 6" stroke-linecap="round" />

    <!-- Cabezal Vibrador / Aguja de Inmersión de Alta Frecuencia (38mm - 45mm) -->
    <g transform="translate(480, 260) rotate(20)">
      <!-- Conexión Antidoblamiento de Manguera -->
      <rect x="0" y="-8" width="25" height="16" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Botella / Cabezal de Acero Templado -->
      <rect x="25" y="-12" width="100" height="24" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
      <!-- Punta Cónica de Impacto -->
      <polygon points="125,-12 145,0 125,12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Ondas de Vibración Excitatriz (12,000 VPM) -->
      <path d="M60 -25 Q75 -35 90 -25" fill="none" stroke="#38bdf8" stroke-width="2" />
      <path d="M50 -35 Q75 -50 100 -35" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
      <path d="M60 25 Q75 35 90 25" fill="none" stroke="#38bdf8" stroke-width="2" />
      <path d="M50 35 Q75 50 100 35" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
    </g>
  </g>

  <!-- Placa Informativa -->
  <g transform="translate(400, 435)">
    <rect x="-190" y="0" width="380" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">VIBRADOR DE CONCRETO 5M • WACKER NEUSON</text>
  </g>
</svg>
