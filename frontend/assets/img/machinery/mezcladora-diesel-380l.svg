<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgMix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="yanmarRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <pattern id="gridMix" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgMix)" />
  <rect width="800" height="500" fill="url(#gridMix)" />
  <circle cx="400" cy="240" r="170" fill="rgba(245, 158, 11, 0.05)" />
  <line x1="60" y1="410" x2="740" y2="410" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- MEZCLADORA DE CONCRETO DIÉSEL 380L -->
  <g transform="translate(180, 80)">
    <!-- Chasis Tubular Reforzado -->
    <path d="M100 320 L350 320 L330 200 L120 200 Z" fill="none" stroke="#334155" stroke-width="8" />
    <line x1="220" y1="200" x2="220" y2="320" stroke="#334155" stroke-width="8" />

    <!-- Tambor / Olla Giratoria de Mezcla (Capacidad 380L) -->
    <!-- Sección Cónica Frontal y Corona Dentada -->
    <g transform="translate(230, 190) rotate(-25)">
      <!-- Base Tambor -->
      <path d="M-80 50 L-80 -50 L10 -70 L10 70 Z" fill="url(#drumGrad)" stroke="#78350f" stroke-width="3" />
      <!-- Cono de Salida -->
      <path d="M10 -70 L110 -35 L110 35 L10 70 Z" fill="url(#drumGrad)" stroke="#78350f" stroke-width="3" />
      <!-- Boca del Tambor Reforzada -->
      <ellipse cx="110" cy="0" rx="10" ry="35" fill="#1e293b" stroke="#facc15" stroke-width="4" />
      
      <!-- Corona Dentada Central de Hierro Nodular -->
      <rect x="-10" y="-72" width="20" height="144" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />
      <!-- Paletas de Mezclado Visibles en Boca -->
      <line x1="85" y1="-15" x2="105" y2="10" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Volante Manual de Vaciado / Descarga -->
    <circle cx="90" cy="180" r="32" fill="none" stroke="#f59e0b" stroke-width="5" />
    <line x1="90" y1="148" x2="90" y2="212" stroke="#f59e0b" stroke-width="4" />
    <line x1="58" y1="180" x2="122" y2="180" stroke="#f59e0b" stroke-width="4" />
    <circle cx="90" cy="180" r="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <!-- Seguro de Bloqueo por Pedal -->
    <rect x="75" y="215" width="30" height="8" rx="2" fill="#ef4444" />

    <!-- Cabina de Motor Yanmar Diésel 10HP -->
    <rect x="330" y="160" width="130" height="120" rx="10" fill="url(#yanmarRed)" stroke="#0f172a" stroke-width="3" />
    <rect x="345" y="180" width="100" height="60" rx="6" fill="#0f172a" />
    <!-- Rejilla de Ventilación del Motor -->
    <line x1="360" y1="195" x2="430" y2="195" stroke="#ef4444" stroke-width="2.5" />
    <line x1="360" y1="205" x2="430" y2="205" stroke="#ef4444" stroke-width="2.5" />
    <line x1="360" y1="215" x2="430" y2="215" stroke="#ef4444" stroke-width="2.5" />
    <!-- Escape Diésel Vertical -->
    <path d="M420 160 L420 120 L435 110" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <rect x="415" y="130" width="10" height="20" rx="3" fill="#334155" />
    <text x="395" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#f8fafc" text-anchor="middle">YANMAR 10HP</text>

    <!-- Barra de Tiro / Lanza de Remolque -->
    <line x1="70" y1="320" x2="-20" y2="320" stroke="#334155" stroke-width="8" />
    <circle cx="-25" cy="320" r="8" fill="#0f172a" stroke="#f59e0b" stroke-width="3" />
    <rect x="30" y="320" width="10" height="25" fill="#334155" />

    <!-- Ruedas Neumáticas de Alta Velocidad (Rin 13) -->
    <!-- Rueda Delantera -->
    <circle cx="110" cy="330" r="34" fill="#0f172a" stroke="#334155" stroke-width="8" />
    <circle cx="110" cy="330" r="16" fill="#facc15" />
    <circle cx="110" cy="330" r="6" fill="#0f172a" />

    <!-- Rueda Trasera -->
    <circle cx="340" cy="330" r="34" fill="#0f172a" stroke="#334155" stroke-width="8" />
    <circle cx="340" cy="330" r="16" fill="#facc15" />
    <circle cx="340" cy="330" r="6" fill="#0f172a" />
  </g>

  <!-- Placa Técnica Superior -->
  <rect x="40" y="35" width="270" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
  <circle cx="60" cy="53" r="6" fill="#f59e0b" />
  <text x="76" y="58" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">MEZCLADORA 380L · YANMAR 10HP</text>

  <!-- Badge Capacidad -->
  <g transform="translate(620, 35)">
    <rect width="140" height="36" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.2" />
    <text x="70" y="23" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">2 BULTOS / CICLO</text>
  </g>
</svg>
